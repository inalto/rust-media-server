# HAProxy in front of an rms cluster (docs/CLUSTER.md §4, used by docker-compose.cluster.yml).
#
#   Internet ──TLS──> Nginx Proxy Manager ──> lb:8080 (this file) ──> rms1:8080, rms2:8080
#   OBS ──1935/tcp──> lb:1935 ──> rms1:1935 | rms2:1935     (any node: live_streams + relay)
#   Browser ──udp──> rmsN:8443/8444 directly (WebRTC never goes through HAProxy)
#
# Checked with: haproxy -c -f haproxy.cfg (HAProxy 2.9).

global
    log stdout format raw local0
    maxconn 20000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 3s
    # HTTP-FLV, WS-FLV, SSE and blocking LL-HLS requests are long: never cut them.
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout client-fin 10s
    timeout http-request 15s
    # No compression and no buffering knobs: HAProxy streams responses as they come.

# DNS of the container network: Docker's 127.0.0.11, Podman's aardvark-dns (gateway IP);
# both are in /etc/resolv.conf. Servers that do not resolve yet start in maintenance
# (init-addr none) and come back when their container is up.
resolvers dns
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold obsolete 30s

frontend http_in
    bind :8080
    # rms trusts X-Real-IP (server.trust_proxy = true): behind NPM it is the client IP.
    # Without NPM in front, HAProxy faces the clients: replace the next line with
    #   http-request set-header X-Real-IP %[src]
    # so that clients cannot choose it.
    http-request set-header X-Real-IP %[src] unless { req.hdr(X-Real-IP) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-For %[req.hdr(X-Real-IP)]
    # The internal routes live on another port (8081), but never forward them anyway.
    http-request deny deny_status 404 if { path_beg /internal/ }
    # LL-HLS / LL-DASH: playlists and segments of one viewer must come from one node
    # (each node packages its own timeline, docs/CLUSTER.md §3.5 strategy A).
    use_backend rms_ll if { path_beg /hls/ /dash/ }
    use_backend rms_whep if { path_beg /whep/ }
    default_backend rms_http

backend rms_http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    default-server check inter 2s fall 2 rise 2 resolvers dns init-addr libc,none
    server rms1 rms1:8080
    server rms2 rms2:8080

# Same viewer -> same node: hash of X-Real-IP (the client IP from NPM, or the source
# address set in the frontend when the header is missing: the "source" fallback).
backend rms_ll
    balance hdr(X-Real-IP)
    hash-type consistent
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    default-server check inter 2s fall 2 rise 2 resolvers dns init-addr libc,none
    server rms1 rms1:8080
    server rms2 rms2:8080

# WHEP signalling: only nodes whose UDP port is reachable (all of them here). A node
# with webrtc.enabled = false answers 307 to another node's whep_url when
# cluster.whep_url is set per node (docs/CLUSTER.md §3.8).
backend rms_whep
    balance leastconn
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    default-server check inter 2s fall 2 rise 2 resolvers dns init-addr libc,none
    server rms1 rms1:8080
    server rms2 rms2:8080

# RTMP ingest: any node accepts any key (ownership in live_streams, viewers on the other
# nodes are relayed). "first" keeps publishers on rms1 while it is up.
frontend rtmp_in
    mode tcp
    option tcplog
    bind :1935
    default_backend rms_rtmp

backend rms_rtmp
    mode tcp
    balance first
    # Health from /healthz on 8080: a draining node (503) gets no new publishers.
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    default-server check port 8080 inter 2s fall 2 rise 2 resolvers dns init-addr libc,none
    server rms1 rms1:1935
    server rms2 rms2:1935

# Statistics page (http://<host>:8404/stats): server states, sessions, health checks.
frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
