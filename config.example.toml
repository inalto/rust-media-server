# rust-media-server (rms) configuration.
#
# Copy to config.toml (read automatically from the working directory) or pass
# --config <file>. Every key is optional; the values below are the defaults.
#
# Precedence: defaults < this file < env vars RMS_<SECTION>_<KEY> (e.g.
# RMS_SERVER_HTTP_BIND=127.0.0.1:8080, RMS_ADMIN_TOKEN=...) < CLI flags
# (--data-dir, --http-bind, --rtmp-bind).

[server]
http_bind = "0.0.0.0:8080"
public_url = ""            # e.g. "https://stream.example.com"; empty = derive from Host header
admin_token = ""           # empty = generate at first start (stored in data/admin_token)
data_dir = "./data"
trust_proxy = false        # honour X-Forwarded-For / X-Real-IP for viewer IPs
max_upload_mb = 1024

[rtmp]
bind = "0.0.0.0:1935"
app = "live"               # advertised in the OBS settings; any app name is accepted
max_connections = 256      # simultaneous RTMP connections (handshake + publish)

[hls]
enabled = true
part_duration = 0.5
max_segment_duration = 6.0
window_segments = 6
linger_secs = 30

[dash]
enabled = true
segment_duration = 2.0

[recording]
remux_to_mp4 = true        # needs ffmpeg
keep_flv = false

[metrics]
sample_interval_secs = 5
session_timeout_secs = 30
retention_days = 90

[ffmpeg]
path = ""                  # empty = search PATH

[webrtc]                   # WebRTC egress via WHEP: POST /whep/<name>
enabled = true
udp_port = 8443            # ONE UDP port for every session: open it in the firewall (not proxied by nginx/Caddy)
public_port = 0            # port advertised in the ICE candidates when NAT maps another one (public 8444 -> 8443); 0 = udp_port
public_ip = []             # e.g. ["203.0.113.7"] behind 1:1 NAT (cloud VM); empty = local interface addresses
ice_lite = true
max_sessions = 100
audio_bitrate_kbps = 96    # AAC -> Opus transcode (needs ffmpeg; without it sessions are video-only)
idle_stop_secs = 30        # stop the per-broadcast WebRTC publisher after this long without viewers
stun_server = ""           # optional, e.g. "stun.l.google.com:19302", advertised in the WHEP Link header

[vod]                      # video on demand: upload or inbox -> one ffmpeg pass -> multi-bitrate CMAF (HLS + DASH)
enabled = true             # false = no uploads, no inbox, no transcoding (existing videos stay playable)
inbox_dir = ""             # watched folder; empty = <data_dir>/vod/inbox. Files in inbox/<ladder>/ use that ladder
scan_interval_secs = 10    # a file is imported once its size and mtime stay unchanged for two scans
max_parallel_jobs = 1      # concurrent ffmpeg transcodes (each encodes every rendition of its ladder)
segment_duration = 4.0     # seconds; also the keyframe interval
encoder = "libx264"        # or a hardware encoder: "h264_nvenc" (NVIDIA), "h264_qsv" (Intel), "h264_vaapi" (Intel/AMD on Linux)
encoder_args = ""          # extra output-side ffmpeg arguments, e.g. "-tune film" (x264) or "-rc vbr -multipass qres" (nvenc)
hwaccel_args = ""          # extra input-side arguments before -i, e.g. "-hwaccel cuda" or "-vaapi_device /dev/dri/renderD128"
preset = "veryfast"        # encoder preset; nvenc: "p4"; qsv: "veryfast"; vaapi: "" (none)
default_ladder = "standard"
keep_source = true         # keep the original after transcoding (needed to re-transcode or download it)

# Ladders: renditions from the largest to the smallest. `height` is the short side (the width
# of a portrait video); 0 = the source size. `video_kbps` 0 = constant quality (CRF 23).
# Renditions taller than the source are skipped (never upscale); at least one is kept.
[[vod.ladders]]
name = "standard"
description = "1080p → 360p, per desktop e mobile"
renditions = [
  { name = "1080p", height = 1080, video_kbps = 5000, audio_kbps = 160 },
  { name = "720p",  height = 720,  video_kbps = 2800, audio_kbps = 128 },
  { name = "480p",  height = 480,  video_kbps = 1400, audio_kbps = 96 },
  { name = "360p",  height = 360,  video_kbps = 800,  audio_kbps = 96 },
]

[[vod.ladders]]
name = "mobile"
description = "720p e 360p, leggero per le reti mobili"
renditions = [
  { name = "720p", height = 720, video_kbps = 2200, audio_kbps = 128 },
  { name = "360p", height = 360, video_kbps = 700,  audio_kbps = 64 },
]

[[vod.ladders]]
name = "single"
description = "Una sola qualità, alla risoluzione originale (CRF 23)"
renditions = [
  { name = "source", height = 0, video_kbps = 0, audio_kbps = 128 },   # height 0 = keep source size, kbps 0 = CRF 23
]

[log]
level = "info"             # RUST_LOG overrides

[cluster]                  # multi-instance mode (preview, docs/CLUSTER.md): PostgreSQL instead of SQLite
enabled = false            # false = single node (SQLite, nothing below is used)
node_id = ""               # unique and stable per node; empty = host name (RMS_CLUSTER_NODE_ID)
database_url = ""          # postgres://rms:PASSWORD@db:5432/rms (RMS_CLUSTER_DATABASE_URL)
advertise_url = ""         # internal URL of this node reachable by the others, e.g. http://rms1:8081
internal_bind = "0.0.0.0:8081"  # listener of /internal/* (never expose it through the public proxy)
internal_secret = ""       # >= 32 random characters, identical on every node (RMS_CLUSTER_INTERNAL_SECRET)
heartbeat_secs = 5         # node registry heartbeat
node_ttl_secs = 15         # a node without heartbeat for this long is dead (>= 2 x heartbeat_secs)
relay_idle_secs = 30       # stop an edge relay without local viewers after this long
# In cluster mode server.admin_token (RMS_ADMIN_TOKEN) is mandatory and identical on every node.
