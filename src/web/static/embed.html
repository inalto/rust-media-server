<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diretta</title>
  <link rel="stylesheet" href="/static/player.css">
</head>
<!-- Served at /embed/{name} (data-mode="embed") and /player/{name} (data-mode="player"). -->
<body data-mode="embed" data-name="{{NAME}}">
  <header class="player-header">
    <h1 id="title">Diretta</h1>
  </header>
  <div id="stage" class="stage">
    <video id="video" playsinline></video>
    <video id="waiting-video" class="waiting-video" muted loop playsinline autoplay hidden></video>
    <div id="waiting" class="waiting" hidden>
      <div class="waiting-inner">
        <span class="pulse-badge"><span class="dot"></span>In attesa della diretta</span>
        <p id="waiting-text">La diretta inizierà a breve</p>
      </div>
    </div>
    <span id="live-badge" class="live-badge" hidden>LIVE</span>
    <button id="unmute" class="unmute" hidden>Attiva audio</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.min.js"></script>
  <script src="/static/player.js"></script>
</body>
</html>
